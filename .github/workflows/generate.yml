name: Generate SDK from OpenAPI spec

# Regenerates src/schema.ts from the goose engine's committed OpenAPI
# document and pushes the result straight to main. The goose repo's own
# "OpenAPI" workflow pushes on every goose-main change; this workflow is
# the SDK-repo-side catch-up path (scheduled sweep, manual dispatch, and
# the openapi-spec-changed repository_dispatch). The spec URL comes from
# scripts/generate.mjs (raw.githubusercontent.com, ref GOOSE_SPEC_REF).
on:
  push:
    branches: [main]
  schedule:
    # Once a week (Monday 03:00 UTC) in case the spec changes without a
    # workflow trigger (e.g. spec regenerated manually in the goose repo).
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      spec_ref:
        description: "git ref in the goose repo to pull the spec from"
        required: false
        default: ""
  repository_dispatch:
    # Optional inbound hook; the goose repo's push-sdk job already pushes
    # the regenerated SDK itself, so this is a manual/backup trigger.
    types: [openapi-spec-changed]

permissions:
  contents: write

concurrency:
  group: generate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Regenerate SDK from the OpenAPI spec
        env:
          # A manual run or repository_dispatch can pin the spec source to
          # any goose ref (branch, tag or SHA); scheduled/push runs use main.
          GOOSE_SPEC_REF: ${{ inputs.spec_ref || github.event.client_payload.ref || 'main' }}
        run: npm run generate

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Push regenerated SDK to main
        env:
          SPEC_REF: ${{ inputs.spec_ref || github.event.client_payload.ref || 'main' }}
        run: |
          git config user.name "goose-openapi-bot"
          git config user.email "noreply@goose-network.github.io"
          if git diff --quiet; then
            echo "SDK already up to date with goose ${SPEC_REF}; nothing to push."
            exit 0
          fi
          git add -A
          git commit -m "Regenerate SDK from goose OpenAPI spec @ ${SPEC_REF}"
          git push
          echo "Pushed regenerated SDK to main."
