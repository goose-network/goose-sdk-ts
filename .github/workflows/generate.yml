name: Generate SDK from OpenAPI spec

# Regenerates src/schema.ts from the goose engine's committed OpenAPI
# document and opens/updates a pull request with the result. Keeps the SDK
# in lockstep with the admin API without manual copying. The spec URL comes
# from scripts/generate.mjs (raw.githubusercontent.com, ref GOOSE_SPEC_REF).
on:
  push:
    branches: [main]
  schedule:
    # Once a week (Monday 03:00 UTC) in case the spec changes without a
    # workflow trigger (e.g. spec regenerated manually in the goose repo).
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      spec_ref:
        description: "git ref in the goose repo to pull the spec from"
        required: false
        default: ""
  repository_dispatch:
    # Fired by the goose repo when internal/api/docs/swagger.json changes
    # on main (see .github/workflows/notify-sdk.yml there).
    types: [openapi-spec-changed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: generate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Regenerate SDK from the OpenAPI spec
        env:
          # A manual run or repository_dispatch can pin the spec source to
          # any goose ref (branch, tag or SHA); scheduled/push runs use main.
          GOOSE_SPEC_REF: ${{ inputs.spec_ref || github.event.client_payload.ref || 'main' }}
        run: npm run generate

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Detect changes
        id: diff
        run: |
          git add src/schema.ts
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update pull request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: |
            Regenerate SDK from goose OpenAPI spec

            Auto-generated by the "Generate SDK from OpenAPI spec" workflow.
          title: "Regenerate SDK from goose OpenAPI spec"
          body: |
            This PR regenerates `src/schema.ts` from the goose engine's
            OpenAPI document and rebuilds the SDK against it.

            Source: [internal/api/docs/swagger.json](https://github.com/goose-network/goose/blob/main/internal/api/docs/swagger.json)

            🤖 Generated with [Claude Code](https://claude.com/claude-code)
          branch: regen/openapi-spec
          delete-branch: true
          labels: |
            generated
